{% extends "base.html" %}
{% block title %}{{ title }} · IdentityForge{% endblock %}
{% block header %}{{ title }}{% endblock %}
{% block content %}
<section class="panel">
  <form method="post" class="form-grid">{% csrf_token %}
    {% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
    <div class="form-actions"><button class="button button-primary" type="submit">Save</button><a class="button" href="{% url 'users' %}">Cancel</a></div>
  </form>
</section>
{% endblock %}
